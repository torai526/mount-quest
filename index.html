<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>マウントクエスト</title>
<style>
:root{--bg:#070b14;--panel:#111a2e;--panel2:#18243d;--text:#f8fafc;--sub:#bec9db;--gold:#fbbf24;--blue:#3b82f6;--red:#ef4444;--cell:#263652;--ok:#22c55e;--line:#ffffff1f}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:radial-gradient(circle at top,#273b68 0,#111827 38%,#070b14 100%);padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
button,select{font:inherit}.app{width:min(100%,720px);margin:auto}.screen{display:none}.screen.active{display:block}.card{background:#111a2ee8;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px #0007;padding:22px}.hero{text-align:center;padding:42px 20px}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:.82rem}.hero h1{font-size:clamp(2rem,8vw,3.5rem);line-height:1.1;margin:12px 0;text-shadow:0 5px 25px #2563eb88}.subtitle{color:var(--sub);line-height:1.7}.menu{display:grid;gap:12px;margin-top:28px}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;color:white;background:linear-gradient(135deg,#2563eb,#1d4ed8);cursor:pointer;box-shadow:0 9px 20px #2563eb42}.btn:active{transform:translateY(1px)}.btn.secondary{background:#25324a;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.ghost{background:transparent;border:1px solid #ffffff2c;box-shadow:none}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title-row h2{margin:0;font-size:1.35rem}.field{margin:18px 0}.field label{display:block;font-weight:800;margin-bottom:9px}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.segmented.two{grid-template-columns:repeat(2,1fr)}.segmented.four{grid-template-columns:repeat(2,1fr)}.choice{position:absolute;opacity:0;pointer-events:none}.choice+span{display:block;text-align:center;padding:11px 8px;border:1px solid #ffffff20;background:#1c2941;border-radius:12px;color:var(--sub);font-weight:700;cursor:pointer}.choice:checked+span{color:white;background:#234f9c;border-color:#60a5fa;box-shadow:0 0 0 2px #60a5fa33}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{font-weight:900;color:var(--gold)}.status{text-align:center;font-size:1.05rem;font-weight:900;margin:10px 0 12px;min-height:1.6em}.status.hero-side{color:#93c5fd}.status.demon-side{color:#fca5a5}.game-layout{display:grid;gap:12px}.reserve{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#10192b;border:1px solid var(--line);border-radius:16px}.reserve-title{grid-column:1/-1;text-align:center;font-size:.82rem;font-weight:800;color:var(--sub)}.reserve-piece{min-height:68px;border:1px solid #ffffff1d;border-radius:13px;background:#1b2943;color:white;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:5px}.reserve-piece.selected{outline:3px solid var(--gold);background:#294876}.reserve-piece:disabled{opacity:.35;cursor:not-allowed}.piece-emoji{font-size:clamp(1.4rem,6vw,2.2rem)}.piece-count{font-weight:900}.board{display:grid;gap:7px;padding:9px;background:#172239;border:1px solid #ffffff1c;border-radius:18px;aspect-ratio:1;width:min(100%,520px);margin:auto}.board.n3{grid-template-columns:repeat(3,1fr)}.board.n4{grid-template-columns:repeat(4,1fr)}.cell{position:relative;border:0;border-radius:12px;background:linear-gradient(145deg,#334761,#22314a);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;box-shadow:inset 0 1px 0 #ffffff17}.cell.selected{outline:4px solid var(--gold);z-index:1}.cell.winning{animation:pulse 700ms infinite alternate;outline:4px solid var(--ok)}@keyframes pulse{to{filter:brightness(1.45)}}.board-piece{width:var(--size);height:var(--size);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 12px #0007,inset 0 2px 1px #ffffff4d;border:3px solid #ffffff55}.board-piece.p0{background:radial-gradient(circle at 30% 25%,#60a5fa,#1d4ed8 58%,#172554)}.board-piece.p1{background:radial-gradient(circle at 30% 25%,#fb7185,#b91c1c 58%,#450a0a)}.board-piece.s1{--size:48%}.board-piece.s2{--size:70%}.board-piece.s3{--size:91%}.board-piece .piece-emoji{font-size:clamp(1rem,7vw,2.8rem);filter:drop-shadow(0 2px 2px #0008)}.badge{position:absolute;right:-6px;bottom:-6px;background:#050914;border:1px solid #ffffff44;border-radius:999px;padding:2px 5px;font-size:.63rem;font-weight:900}.game-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#050914e8;color:white;border:1px solid #ffffff2e;border-radius:999px;padding:11px 18px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.open{display:flex}.modal-card{width:min(100%,430px);text-align:center}.modal-card h2{font-size:2rem;margin:5px}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#1a2740;border-radius:14px;padding:15px;text-align:center}.stat strong{display:block;font-size:1.65rem;color:var(--gold)}.achievement-list{display:grid;gap:9px}.achievement{display:flex;gap:12px;align-items:center;background:#19263e;border-radius:13px;padding:12px;opacity:.45}.achievement.unlocked{opacity:1;border:1px solid #fbbf2455}.achievement-icon{font-size:1.8rem}.achievement div{text-align:left}.achievement strong{display:block}.achievement small{color:var(--sub)}.note{color:var(--sub);font-size:.85rem;line-height:1.5}.footer{text-align:center;color:#8290a8;font-size:.76rem;margin-top:14px}@media(min-width:640px){.segmented.four{grid-template-columns:repeat(4,1fr)}.card{padding:28px}.reserve-piece{min-height:78px}}
</style>
</head>
<body>
<div class="app">
  <section id="homeScreen" class="screen active">
    <div class="card hero">
      <div class="eyebrow">勇者軍 VS 魔王軍</div>
      <h1>⚔️ マウントクエスト ⚔️</h1>
      <p class="subtitle">大きな仲間で小さな敵を覆い、縦・横・斜めをそろえよう。</p>
      <div class="menu">
        <button class="btn" data-nav="setupScreen">冒険を始める</button>
        <button class="btn secondary" data-nav="statsScreen">📊 戦績</button>
        <button class="btn secondary" data-nav="achievementsScreen">🏆 実績</button>
      </div>
    </div>
    <p class="footer">Mount Quest v0.1</p>
  </section>

  <section id="setupScreen" class="screen">
    <div class="card">
      <div class="title-row"><h2>冒険の設定</h2><button class="btn ghost" data-nav="homeScreen">戻る</button></div>
      <div class="field"><label>対戦モード</label><div class="segmented two">
        <label><input class="choice" type="radio" name="mode" value="ai" checked><span>魔王AIと対戦</span></label>
        <label><input class="choice" type="radio" name="mode" value="local"><span>2人で対戦</span></label>
      </div></div>
      <div class="field"><label>盤面</label><div class="segmented two">
        <label><input class="choice" type="radio" name="size" value="3"><span>3 × 3</span></label>
        <label><input class="choice" type="radio" name="size" value="4" checked><span>4 × 4</span></label>
      </div></div>
      <div id="difficultyField" class="field"><label>AI難易度</label><div class="segmented four">
        <label><input class="choice" type="radio" name="difficulty" value="easy"><span>初級</span></label>
        <label><input class="choice" type="radio" name="difficulty" value="medium" checked><span>中級</span></label>
        <label><input class="choice" type="radio" name="difficulty" value="hard"><span>上級</span></label>
        <label><input class="choice" type="radio" name="difficulty" value="expert"><span>最強</span></label>
      </div></div>
      <div class="field"><label>勇者軍の手番</label><div class="segmented">
        <label><input class="choice" type="radio" name="first" value="hero" checked><span>先手</span></label>
        <label><input class="choice" type="radio" name="first" value="demon"><span>後手</span></label>
        <label><input class="choice" type="radio" name="first" value="random"><span>ランダム</span></label>
      </div></div>
      <p id="modeNote" class="note">AI対戦では、あなたは勇者軍、AIは魔王軍で固定されます。</p>
      <button id="launchBtn" class="btn" style="width:100%">出撃する</button>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="topbar"><span class="brand">マウントクエスト</span><button id="quitBtn" class="btn ghost">冒険を終える</button></div>
    <div id="status" class="status hero-side">勇者軍の手番</div>
    <div class="game-layout">
      <div id="heroReserve" class="reserve"></div>
      <div id="board" class="board n4" aria-label="ゲーム盤"></div>
      <div id="demonReserve" class="reserve"></div>
      <div class="game-actions"><button id="resetBtn" class="btn secondary">最初から</button><button id="rulesBtn" class="btn secondary">遊び方</button></div>
    </div>
  </section>

  <section id="statsScreen" class="screen"><div class="card"><div class="title-row"><h2>📊 戦績</h2><button class="btn ghost" data-nav="homeScreen">戻る</button></div><div id="statsGrid" class="stats-grid"></div><button id="clearDataBtn" class="btn danger" style="width:100%;margin-top:18px">記録をリセット</button></div></section>
  <section id="achievementsScreen" class="screen"><div class="card"><div class="title-row"><h2>🏆 実績</h2><button class="btn ghost" data-nav="homeScreen">戻る</button></div><div id="achievementList" class="achievement-list"></div></div></section>
</div>

<div id="resultModal" class="modal"><div class="card modal-card"><div id="resultIcon" style="font-size:3rem">⚔️</div><h2 id="resultTitle">勇者軍の勝利！</h2><p id="resultText" class="subtitle"></p><div class="menu"><button id="rematchBtn" class="btn">もう一度</button><button id="resultHomeBtn" class="btn secondary">タイトルへ</button></div></div></div>
<div id="rulesModal" class="modal"><div class="card modal-card"><h2>遊び方</h2><p class="subtitle" style="text-align:left">自軍の持ち駒、または盤上で一番上にある自軍の駒を選び、マスを選択します。大きな駒は小さな駒に重ねられます。縦・横・斜めのいずれか1列を自軍の駒でそろえると勝利です。</p><button id="closeRulesBtn" class="btn">閉じる</button></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const PIECES=[
  [{name:"魔法使い",emoji:"🧙",size:1},{name:"戦士",emoji:"🛡️",size:2},{name:"勇者",emoji:"⚔️",size:3}],
  [{name:"ゴブリン",emoji:"👺",size:1},{name:"魔人",emoji:"😈",size:2},{name:"魔王",emoji:"👑",size:3}]
];
const PLAYER_NAMES=["勇者軍","魔王軍"];
const ACHIEVEMENTS=[
  {id:"firstGame",icon:"🗺️",name:"冒険の始まり",desc:"初めて対局する"},
  {id:"firstWin",icon:"⚔️",name:"勇者誕生",desc:"AI対戦で初勝利する"},
  {id:"cover10",icon:"💥",name:"マウント見習い",desc:"累計10回、駒を覆う"},
  {id:"hardWin",icon:"🛡️",name:"魔王討伐",desc:"上級AIに勝利する"},
  {id:"expertWin",icon:"👑",name:"伝説の勇者",desc:"最強AIに勝利する"},
  {id:"tenWins",icon:"🏆",name:"百戦錬磨への道",desc:"AI対戦で10勝する"}
];
let config={mode:"ai",size:4,difficulty:"medium",first:"hero"};
let rules=null,state=null,selection=null,gameOver=false,winningLine=[],aiThinking=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function defaultData(){return {games:0,wins:0,losses:0,draws:0,covers:0,byDifficulty:{easy:{w:0,l:0},medium:{w:0,l:0},hard:{w:0,l:0},expert:{w:0,l:0}},unlocked:{}}}
function loadData(){try{return {...defaultData(),...JSON.parse(localStorage.getItem("mountQuestData")||"{}")}}catch{return defaultData()}}
function saveData(d){localStorage.setItem("mountQuestData",JSON.stringify(d))}
function unlock(id){const d=loadData();if(!d.unlocked)d.unlocked={};if(!d.unlocked[id]){d.unlocked[id]=true;saveData(d);const a=ACHIEVEMENTS.find(x=>x.id===id);if(a)toast(`実績解除：${a.name}`)}}
function showScreen(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='statsScreen')renderStats();if(id==='achievementsScreen')renderAchievements();scrollTo(0,0)}
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.nav)));
$$('input[name="mode"]').forEach(x=>x.addEventListener('change',()=>{const ai=x.value==='ai'&&x.checked;$('#difficultyField').classList.toggle('hidden',!ai);$('#modeNote').textContent=ai?'AI対戦では、あなたは勇者軍、AIは魔王軍で固定されます。':'2人対戦では、勇者軍と魔王軍を交互に操作します。'}));
function selected(name){return $(`input[name="${name}"]:checked`).value}
class Rules{
  constructor(n){this.n=n;this.k=n;this.counts=n===3?[2,2,2]:[4,3,3];this.lines=[];for(let r=0;r<n;r++)this.lines.push(Array.from({length:n},(_,c)=>r*n+c));for(let c=0;c<n;c++)this.lines.push(Array.from({length:n},(_,r)=>r*n+c));this.lines.push(Array.from({length:n},(_,i)=>i*n+i));this.lines.push(Array.from({length:n},(_,i)=>i*n+(n-1-i)))}
}
class State{
  constructor(r,board=null,reserves=null,turn=0){this.rules=r;this.board=board||Array.from({length:r.n*r.n},()=>[]);this.reserves=reserves||[[...r.counts],[...r.counts]];this.turn=turn}
  top(i){const s=this.board[i];return s.length?s[s.length-1]:null}
  winners(){const out=[];for(const line of this.rules.lines){const p=this.top(line[0])?.player;if(p!==undefined&&line.every(i=>this.top(i)?.player===p)&&!out.some(x=>x.player===p))out.push({player:p,line})}return out}
  legal(m){if(!Number.isInteger(m.dst)||m.dst<0||m.dst>=this.board.length||m.size<1||m.size>3)return false;const target=this.top(m.dst);if(target&&m.size<=target.size)return false;if(m.src===null)return this.reserves[this.turn][m.size-1]>0;if(m.src===m.dst||m.src<0||m.src>=this.board.length)return false;const p=this.top(m.src);return !!p&&p.player===this.turn&&p.size===m.size}
  apply(m){const b=this.board.map(s=>s.map(p=>({...p}))),r=this.reserves.map(x=>[...x]);let covered=false;if(m.src===null){r[this.turn][m.size-1]--;covered=b[m.dst].length>0;b[m.dst].push({player:this.turn,size:m.size})}else{const p=b[m.src].pop();covered=b[m.dst].length>0;b[m.dst].push(p)}return {state:new State(this.rules,b,r,1-this.turn),covered}}
  moves(){const a=[];for(let z=1;z<=3;z++)if(this.reserves[this.turn][z-1]>0)for(let d=0;d<this.board.length;d++){const m={src:null,dst:d,size:z};if(this.legal(m))a.push(m)}for(let s=0;s<this.board.length;s++){const p=this.top(s);if(p?.player===this.turn)for(let d=0;d<this.board.length;d++){const m={src:s,dst:d,size:p.size};if(this.legal(m))a.push(m)}}return a}
}
function startGame(){config={mode:selected('mode'),size:+selected('size'),difficulty:selected('difficulty'),first:selected('first')};if(config.first==='random')config.first=Math.random()<.5?'hero':'demon';rules=new Rules(config.size);state=new State(rules,null,null,config.first==='hero'?0:1);selection=null;gameOver=false;winningLine=[];aiThinking=false;unlock('firstGame');showScreen('gameScreen');renderGame();if(config.mode==='ai'&&state.turn===1)requestAI()}
$('#launchBtn').addEventListener('click',startGame);
function renderGame(){const st=$('#status');st.textContent=gameOver?'対局終了':aiThinking?'魔王AIが思考中…':`${PLAYER_NAMES[state.turn]}の手番`;st.className=`status ${state.turn===0?'hero-side':'demon-side'}`;renderReserve('#heroReserve',0);renderReserve('#demonReserve',1);const board=$('#board');board.className=`board n${rules.n}`;board.innerHTML='';for(let i=0;i<state.board.length;i++){const c=document.createElement('button');c.className='cell';c.type='button';if(selection?.src===i)c.classList.add('selected');if(winningLine.includes(i))c.classList.add('winning');const p=state.top(i);if(p){const d=document.createElement('div');d.className=`board-piece p${p.player} s${p.size}`;d.innerHTML=`<span class="piece-emoji">${PIECES[p.player][p.size-1].emoji}</span><span class="badge">${p.size}</span>`;c.appendChild(d)}c.addEventListener('click',()=>cellClick(i));board.appendChild(c)}}
function renderReserve(sel,player){const el=$(sel);el.innerHTML=`<div class="reserve-title">${PLAYER_NAMES[player]}の持ち駒</div>`;PIECES[player].forEach(piece=>{const count=state.reserves[player][piece.size-1],b=document.createElement('button');b.type='button';b.className='reserve-piece';if(selection?.src===null&&selection.size===piece.size&&state.turn===player)b.classList.add('selected');b.disabled=gameOver||aiThinking||state.turn!==player||count===0||(config.mode==='ai'&&player===1);b.innerHTML=`<span class="piece-emoji">${piece.emoji}</span><span>${piece.name}</span><span class="piece-count">×${count}</span>`;b.addEventListener('click',()=>{selection={src:null,size:piece.size};renderGame()});el.appendChild(b)})}
function cellClick(i){if(gameOver||aiThinking||(config.mode==='ai'&&state.turn===1))return;if(selection){const m={src:selection.src,dst:i,size:selection.size};if(state.legal(m)){playMove(m,false);return}toast('そこには置けません')}const p=state.top(i);if(p&&p.player===state.turn){selection={src:i,size:p.size};renderGame()}}
function playMove(move,fromAI){const mover=state.turn,result=state.apply(move);state=result.state;selection=null;if(result.covered){const d=loadData();d.covers++;saveData(d);if(d.covers>=10)unlock('cover10');toast(`${PIECES[mover][move.size-1].name}がマウント！`)}const wins=state.winners();if(wins.length){const own=wins.find(x=>x.player===mover)||wins[0];finish(own.player,own.line);return}renderGame();if(config.mode==='ai'&&state.turn===1&&!fromAI)requestAI()}
function finish(winner,line){gameOver=true;winningLine=line;renderGame();if(config.mode==='ai'){const d=loadData();d.games++;if(winner===0){d.wins++;d.byDifficulty[config.difficulty].w++}else{d.losses++;d.byDifficulty[config.difficulty].l++}saveData(d);if(winner===0){unlock('firstWin');if(config.difficulty==='hard')unlock('hardWin');if(config.difficulty==='expert')unlock('expertWin');if(d.wins>=10)unlock('tenWins')}}$('#resultIcon').textContent=winner===0?'✨⚔️✨':'🔥👑🔥';$('#resultTitle').textContent=`${PLAYER_NAMES[winner]}の勝利！`;$('#resultText').textContent=winner===0?'勇者軍が魔王軍を打ち破りました。':'魔王軍が世界を支配しました。';setTimeout(()=>$('#resultModal').classList.add('open'),450)}
function requestAI(){aiThinking=true;renderGame();setTimeout(()=>{const m=AI.choose(state,config.difficulty);aiThinking=false;if(m)playMove(m,true);else renderGame()},80)}
class AI{
 static choose(s,diff){let moves=s.moves();if(!moves.length)return null;for(const m of moves){const ns=s.apply(m).state;if(ns.winners().some(w=>w.player===s.turn))return m}if(diff==='easy'){const safe=this.safeMoves(s,moves);const pool=Math.random()<.65?moves:(safe.length?safe:moves);return pool[Math.floor(Math.random()*pool.length)]}const safe=this.safeMoves(s,moves);if(safe.length)moves=safe;const setting={medium:[2,120],hard:[3,350],expert:[5,900]}[diff]||[2,120];const start=performance.now(),root=s.turn;let best=moves[0];moves=this.order(s,moves,root);for(let depth=1;depth<=setting[0];depth++){let localBest=null,localScore=-Infinity;for(const m of moves){if(performance.now()-start>setting[1])break;const score=this.search(s.apply(m).state,depth-1,-Infinity,Infinity,root,start,setting[1]);if(score>localScore){localScore=score;localBest=m}}if(localBest)best=localBest;else break}return best}
 static safeMoves(s,moves){const me=s.turn;return moves.filter(m=>{const ns=s.apply(m).state;return !ns.moves().some(om=>ns.apply(om).state.winners().some(w=>w.player===1-me))})}
 static search(s,depth,a,b,root,start,limit){if(performance.now()-start>limit)return this.eval(s,root);const ws=s.winners();if(ws.some(w=>w.player===root))return 100000+depth;if(ws.some(w=>w.player===1-root))return -100000-depth;if(depth<=0)return this.eval(s,root);const maximizing=s.turn===root;let val=maximizing?-Infinity:Infinity;const moves=this.order(s,s.moves(),root);if(!moves.length)return 0;for(const m of moves){const v=this.search(s.apply(m).state,depth-1,a,b,root,start,limit);if(maximizing){val=Math.max(val,v);a=Math.max(a,val)}else{val=Math.min(val,v);b=Math.min(b,val)}if(b<=a||performance.now()-start>limit)break}return val}
 static eval(s,root){let score=0;const n=s.rules.n;for(const line of s.rules.lines){let mine=0,opp=0,sizeMine=0,sizeOpp=0;for(const q of line){const p=s.top(q);if(!p)continue;if(p.player===root){mine++;sizeMine+=p.size}else{opp++;sizeOpp+=p.size}}if(mine&&!opp)score+=Math.pow(8,mine)+sizeMine*3;if(opp&&!mine)score-=Math.pow(9,opp)+sizeOpp*3;if(mine===n-1&&!opp)score+=900;if(opp===n-1&&!mine)score-=1100}const centers=n===3?[4]:[5,6,9,10];for(const q of centers){const p=s.top(q);if(p)score+=(p.player===root?1:-1)*(12+p.size*2)}for(let z=0;z<3;z++)score+=(s.reserves[root][z]-s.reserves[1-root][z])*(z+1);return score}
 static order(s,moves,root){const centers=s.rules.n===3?[4]:[5,6,9,10];return [...moves].sort((a,b)=>this.priority(s,b,centers,root)-this.priority(s,a,centers,root))}
 static priority(s,m,centers,root){let v=m.size*4+(centers.includes(m.dst)?15:0)+(s.top(m.dst)?20:0);const ns=s.apply(m).state;if(ns.winners().some(w=>w.player===s.turn))v+=10000;return v}
}
$('#quitBtn').addEventListener('click',()=>{if(confirm('対局を終了してタイトルへ戻りますか？'))showScreen('homeScreen')});
$('#resetBtn').addEventListener('click',()=>{if(confirm('同じ設定で最初からやり直しますか？')){rules=new Rules(config.size);state=new State(rules,null,null,config.first==='hero'?0:1);selection=null;gameOver=false;winningLine=[];renderGame();if(config.mode==='ai'&&state.turn===1)requestAI()}});
$('#rulesBtn').addEventListener('click',()=>$('#rulesModal').classList.add('open'));$('#closeRulesBtn').addEventListener('click',()=>$('#rulesModal').classList.remove('open'));
$('#rematchBtn').addEventListener('click',()=>{$('#resultModal').classList.remove('open');rules=new Rules(config.size);state=new State(rules,null,null,config.first==='hero'?0:1);selection=null;gameOver=false;winningLine=[];renderGame();if(config.mode==='ai'&&state.turn===1)requestAI()});
$('#resultHomeBtn').addEventListener('click',()=>{$('#resultModal').classList.remove('open');showScreen('homeScreen')});
function renderStats(){const d=loadData(),rate=d.games?Math.round(d.wins/d.games*100):0;$('#statsGrid').innerHTML=`<div class="stat"><strong>${d.games}</strong>AI対局</div><div class="stat"><strong>${d.wins}</strong>勝利</div><div class="stat"><strong>${d.losses}</strong>敗北</div><div class="stat"><strong>${rate}%</strong>勝率</div><div class="stat"><strong>${d.covers}</strong>マウント</div><div class="stat"><strong>${Object.keys(d.unlocked||{}).length}</strong>実績解除</div>`}
function renderAchievements(){const d=loadData();$('#achievementList').innerHTML=ACHIEVEMENTS.map(a=>`<div class="achievement ${d.unlocked?.[a.id]?'unlocked':''}"><span class="achievement-icon">${d.unlocked?.[a.id]?a.icon:'🔒'}</span><div><strong>${a.name}</strong><small>${a.desc}</small></div></div>`).join('')}
$('#clearDataBtn').addEventListener('click',()=>{if(confirm('戦績と実績をすべて削除しますか？')){localStorage.removeItem('mountQuestData');renderStats();toast('記録をリセットしました')}});
let toastTimer;function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
</script>
