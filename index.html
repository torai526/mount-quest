<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>マウントクエスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      background:
        radial-gradient(
          circle at top,
          #25375f 0%,
          #111827 45%,
          #070b14 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic UI",
        sans-serif;
    }

    .title-screen {
      width: min(100%, 520px);
      padding: 42px 24px;

      text-align: center;

      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;

      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .eyebrow {
      margin: 0 0 14px;

      color: #fbbf24;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;

      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1.2;

      text-shadow: 0 4px 18px rgba(37, 99, 235, 0.5);
    }

    .subtitle {
      margin: 20px 0 32px;

      color: #cbd5e1;
      line-height: 1.7;
    }

    button {
      width: min(100%, 280px);
      padding: 16px 24px;

      color: white;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);

      border: 0;
      border-radius: 14px;

      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);

      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;

      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    .message {
      min-height: 1.5em;
      margin: 22px 0 0;

      color: #93c5fd;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="title-screen">
    <p class="eyebrow">勇者軍 VS 魔王軍</p>

    <h1>⚔️ マウントクエスト ⚔️</h1>

    <p class="subtitle">
      重ねて、隠して、魔王を討て！
    </p>

    <button id="startBtn" type="button">
      ゲーム開始
    </button>

    <p
      id="message"
      class="message"
      aria-live="polite"
    ></p>
  </main>

  <script>
    "use strict";

    const startButton = document.getElementById("startBtn");
    const message = document.getElementById("message");

    startButton.addEventListener("click", function () {
      message.textContent = "⚔️ 冒険の準備が整いました！";
    });
  </script>
</body>
</html>
